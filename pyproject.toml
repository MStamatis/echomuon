[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "echomuon"
version = "0.2.2"
description = "EchoMuon: experimental research optimizer - Muon with a per-direction cross-timescale trust gate. Narrow, audited regime of benefit; single-GPU only. See README before use."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Stamatis Mastromichalakis", email = "stamatis@tmnetworks.gr" }]
keywords = ["optimizer", "muon", "deep-learning", "pytorch", "orthogonalization", "research", "experimental"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.0"]

[project.urls]
Homepage = "https://github.com/MStamatis/echomuon"
Paper = "https://arxiv.org/abs/ARXIV-PLACEHOLDER"

[tool.setuptools.packages.find]
where = ["src"]
